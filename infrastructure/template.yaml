AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudDoc - serverless document processing

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AlertEmail:
    Type: String
    Default: ""
    Description: Email address for alarm notifications. Leave empty to create alarms without email.
    
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

Resources:
  # ---------- Queues ----------
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub clouddoc-documents-dlq-${Stage}
      MessageRetentionPeriod: 1209600   # 14 days to investigate failures
      SqsManagedSseEnabled: true

  DocumentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub clouddoc-documents-${Stage}
      VisibilityTimeout: 180            # 6x the worker timeout, as AWS recommends
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3              # third failed attempt moves the message to the DLQ

  DocumentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DocumentQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowUploadBucketToSendMessages
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DocumentQueue.Arn
            Condition:
              ArnEquals:
                # Built from the bucket name, not GetAtt, to avoid a circular dependency
                aws:SourceArn: !Sub "arn:aws:s3:::clouddoc-uploads-${Stage}-${AWS::AccountId}-${AWS::Region}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ---------- Database ----------
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub clouddoc-documents-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ---------- Storage ----------
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: DocumentQueuePolicy
    Properties:
      BucketName: !Sub clouddoc-uploads-${Stage}-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Queue: !GetAtt DocumentQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub "${UploadBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  # ---------- Logs (kept 14 days) ----------
  UploadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/clouddoc-upload-${Stage}"
      RetentionInDays: 14

  StatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/clouddoc-status-${Stage}"
      RetentionInDays: 14

  WorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/clouddoc-worker-${Stage}"
      RetentionInDays: 14

  # ---------- Functions ----------
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddoc-upload-${Stage}
      CodeUri: ../src/
      Handler: api.upload_handler.lambda_handler
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadBucket
          TABLE_NAME: !Ref DocumentsTable
          MAX_FILE_SIZE_BYTES: "10485760"
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        LogGroup: !Ref UploadFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${UploadBucket.Arn}/uploads/*"
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn
      Events:
        CreateDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents
            Method: POST
  
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddoc-status-${Stage}
      CodeUri: ../src/
      Handler: api.status_handler.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DocumentsTable
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        LogGroup: !Ref StatusFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt DocumentsTable.Arn
      Events:
        GetDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{document_id}
            Method: GET

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddoc-worker-${Stage}
      CodeUri: ../src/
      Handler: processor.document_worker.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref DocumentsTable
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        LogGroup: !Ref WorkerFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${UploadBucket.Arn}/uploads/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt UploadBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: "uploads/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DocumentsTable.Arn
      Events:
        DocumentQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt DocumentQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2

  # ---------- Alerts ----------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub clouddoc-alerts-${Stage}

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub clouddoc-dlq-not-empty-${Stage}
      AlarmDescription: A document message failed all retries. See docs/runbook.md.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub clouddoc-worker-errors-${Stage}
      AlarmDescription: The worker crashed or timed out. See docs/runbook.md.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub clouddoc-api-5xx-${Stage}
      AlarmDescription: The API returned a server error. See docs/runbook.md.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ---------- Dashboard ----------
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub clouddoc-${Stage}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": { "markdown": "# CloudDoc (${Stage})\nS3 upload, SQS queue, Lambda worker, DynamoDB tracking. Runbook: docs/runbook.md" }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "API requests and errors", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", "Stage", "${Stage}"],
                  ["AWS/ApiGateway", "4xx", "ApiId", "${HttpApi}", "Stage", "${Stage}"],
                  ["AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}", "Stage", "${Stage}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Queue depth (messages waiting)", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Maximum", "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DocumentQueue.QueueName}"],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DeadLetterQueue.QueueName}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Worker invocations and errors", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Sum", "period": 60,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${WorkerFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${WorkerFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Worker duration (ms)", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Average", "period": 60,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${WorkerFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${WorkerFunction}", { "stat": "Maximum" }]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB consumed capacity", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Sum", "period": 60,
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${DocumentsTable}"],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${DocumentsTable}"]
                ]
              }
            },
            {
              "type": "alarm", "x": 12, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Alarm status",
                "alarms": [
                  "${DeadLetterQueueAlarm.Arn}",
                  "${WorkerErrorsAlarm.Arn}",
                  "${Api5xxAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  UploadBucketName:
    Description: Name of the upload bucket
    Value: !Ref UploadBucket
  ApiId:
    Description: HTTP API ID
    Value: !Ref HttpApi
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  QueueUrl:
    Description: Document processing queue
    Value: !Ref DocumentQueue
  DeadLetterQueueUrl:
    Description: Dead-letter queue for failed jobs
    Value: !Ref DeadLetterQueue
  TableName:
    Description: DynamoDB table for document records
    Value: !Ref DocumentsTable
  AlertTopicArn:
    Description: SNS topic that receives alarm notifications
    Value: !Ref AlertTopic